<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Kenya Peterson"/>
    <meta name="description" content="Spots"/>
    <meta name="keywords" content="..."/>
    <link rel="icon" href="./favicon.ico" type="image/x-icon"/>
    <title>Spots</title>
</head>
<body>
   <div class="page">
    <header class="header">
        <img id="spots-logo" alt="Spots Logo" class="header__logo">
    </header>
    <main class="content">
        <section class="profile page__section">
            <div class="profile__avatar-container">
            <button type="button" class="profile__avatar-button">
                <img 
                id="avatar-button" 
                src="<%= require('./images/pencil-light.svg') %>"
                class="profile__pencil-icon" 
                alt="Avatar Pencil icon">
            </button>
            <img 
            id="spots-avatar" 
            alt="Profile Image" 
            class="profile__avatar">
            </div>

            <div class="profile__column">
                <h1 class="profile__name">Bessie Coleman</h1>
                <p class="profile__description">Civil Aviator</p>
                <button type="button" class="profile__edit-button">
                    <img id="spots-pencil" alt="Pencil icon" class="profile__edit-button-icon">Edit Profile
                </button>
            </div>
            <button type="button" class="profile__add-button">
                <img id="spots-add" alt="Add icon"> New Post
            </button>
        </section>
        <section class="cards page__section">
            <ul class="cards__list">
                <template id="card-template">
                    <li class="card">
                        <button
                        type="button"
                        class="card__delete-button"
                        ></button>
                        <img 
                        class="card__image"
                        src="" 
                        alt="" 
                        />
                        <div class="card__content">
                            <h2 class="card__title"></h2>
                            <button  
                            type="button"
                            class="card__like-button"
                            ></button>
                        </div>
                    </li>
                </template>                
            </ul>
        </section>
    </main>
    <footer class="footer">
        <p class="footer__copyright">2024 &copy; Kenya Peterson</p>
    </footer>
    <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
            <button type="button" class="modal__close-button"></button>
            <h2 class="modal__title">Edit profile</h2>
            <form name="edit-profile" id="edit-profile" class="modal__form" novalidate>
                <label class="modal__label">
                    Name
                    <input 
                    id="name-input" 
                    type="text" 
                    class="modal__input" 
                    placeholder="Type your name" 
                    required 
                    minlength="2" 
                    maxlength="40">
                    <span id="name-input-error" class="modal__error"></span>
                </label>
                <label class="modal__label">
                    Description
                    <input 
                    id="description-input" 
                    type="text" 
                    class="modal__input" 
                    placeholder="Describe yourself" 
                    required
                    minlength="2" 
                    maxlength="200">
                    <span id="description-input-error" class="modal__error"></span>
                </label>
                <button type="submit" class="modal__submit-button">Save</button>
            </form>
        </div>
    </div>
    <div class="modal" id="add-card-modal">
        <div class="modal__container">
            <button class="modal__close-button"></button>
            <h2 class="modal__title">New Post</h2>
            <form name="add-card-modal" id="add-card" class="modal__form" novalidate>
                <label class="modal__label">
                    Image link
                    <input 
                    id="card-link-input" 
                    type="url" 
                    class="modal__input" 
                    placeholder="Pasta a link to the picture" 
                    required>
                    <span id="card-link-input-error" class="modal__error"></span>
                </label>
                <label class="modal__label">
                    Caption
                    <input 
                    id="card-caption-input" 
                    type="text" 
                    class="modal__input" 
                    placeholder="Type your caption" 
                    required
                    minlength="2"
                    maxlength="30">
                    <span id="card-caption-input-error" class="modal__error"></span>
                </label>
                <button type="submit" class="modal__submit-button">Save</button>
            </form>
        </div>
    </div>
   </div> 
    <div class="modal" id="preview-modal">
        <div class="modal__content modal__content_type_preview">
            <button type="button" class="modal__close-button modal__close-button_preview"></button>
            <img 
            class="modal__image"
            src="" 
            alt="" />
            <p class="modal__caption"></p>
        </div>
    </div>
        <div class="modal" id="avatar-modal">
            <div class="modal__container">
                <button class="modal__close-button"></button>
                <h3 class="modal__title">Avatar Image</h3>
                <form name="add-avatar-modal" id="edit-avatar-form" class="modal__form" novalidate>
                    <label class="modal__label" for="profile-avatar-input">
                        Avatar
                        <input 
                        name="avatar"
                        id="profile-avatar-input" 
                        type="url" 
                        class="modal__input" 
                        placeholder="Avatar link" 
                        required>
                        <span id="profile-avatar-input-error" class="modal__error"></span>
                    </label>
                    <button type="submit" class="modal__submit-button">Save</button>
                </form>
            </div>
        </div>
        <div class="modal" id="delete-modal">
            <div class="modal__container">
                <button class="modal__close-button modal__close-button_delete"></button>
                <h3 class="modal__title">Are you sure you want to delete this image?</h3>
                <form name="delete-modal" id="delete-form" class="modal__form" novalidate>
                    <div class="modal__options">
                        <button type="submit" class="modal__delete-button">Delete</button>
                        <button type="button" class="modal__cancel-button">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </body>
</html>
